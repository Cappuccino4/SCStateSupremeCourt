[project]
name = "sc-advance-sheet-digest"
version = "1.0.0"
description = "Weekly AI summaries of South Carolina appellate opinions, emailed with Buttondown."
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning:pdfminer.*",
]
