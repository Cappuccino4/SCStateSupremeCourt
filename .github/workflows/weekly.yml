name: Weekly SC Advance Sheet Digest

on:
  schedule:
    # GitHub runs schedules in UTC and may start them a few minutes late.
    # Wednesday 20:17 UTC = 4:17 PM EDT (Mar-Nov) / 3:17 PM EST (Nov-Mar)
    - cron: "17 20 * * 3"
    # Thursday 13:17 UTC = 9:17 AM EDT / 8:17 AM EST (catches late postings; exits quietly if nothing is new)
    - cron: "17 13 * * 4"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: build the digest and upload it as an artifact, but send no email and leave data/processed.json unchanged"
        type: boolean
        default: true
      lookback_days:
        description: "Optional: how many days back to look for opinions (blank = setting or default 10)"
        type: string
        required: false
        default: ""
      max_opinions:
        description: "Optional: maximum opinions to summarize this run (blank = setting or default 25)"
        type: string
        required: false
        default: ""

permissions:
  contents: write # commit data/processed.json after a successful run

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    # Room for a large catch-up run (up to 200 items at roughly 20 seconds each). Minutes are free in
    # a public repository; a normal week takes a few minutes.
    timeout-minutes: 120
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The branch's newest commit when the job starts, not the commit the run was triggered on:
          # a run that waited for another one (or a re-run) must see the data/processed.json it committed.
          ref: ${{ github.ref }}
          fetch-depth: 0 # full history so the processed.json commit can rebase cleanly before pushing

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore summary cache
        # Summaries already paid for (for example by a dry run) are reused instead of being bought twice.
        uses: actions/cache/restore@v6
        with:
          path: .cache/summaries
          key: summaries-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: summaries-

      - name: Build the digest
        id: digest
        env:
          # Secrets: these never appear in the log.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
          COURTLISTENER_API_TOKEN: ${{ secrets.COURTLISTENER_API_TOKEN }}
          # Settings: read from a repository Variable if one exists, otherwise from a Secret of the same name.
          # (Variables are better for non-secret settings: GitHub hides every occurrence of a secret's value
          # in the log, so a secret AUTO_SEND=false would turn every "false" in the log into ***.)
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL || secrets.CLAUDE_MODEL }}
          SUMMARY_EFFORT: ${{ vars.SUMMARY_EFFORT || secrets.SUMMARY_EFFORT }}
          AUTO_SEND: ${{ vars.AUTO_SEND || secrets.AUTO_SEND }}
          INCLUDE_SUPREME_COURT: ${{ vars.INCLUDE_SUPREME_COURT || secrets.INCLUDE_SUPREME_COURT }}
          INCLUDE_COURT_OF_APPEALS: ${{ vars.INCLUDE_COURT_OF_APPEALS || secrets.INCLUDE_COURT_OF_APPEALS }}
          INCLUDE_ORDERS: ${{ vars.INCLUDE_ORDERS || secrets.INCLUDE_ORDERS }}
          SOURCE: ${{ vars.SOURCE || secrets.SOURCE }}
          MAX_OPINIONS_PER_RUN: ${{ inputs.max_opinions || vars.MAX_OPINIONS_PER_RUN || secrets.MAX_OPINIONS_PER_RUN }}
          MAX_INPUT_TOKENS_PER_OPINION: ${{ vars.MAX_INPUT_TOKENS_PER_OPINION || secrets.MAX_INPUT_TOKENS_PER_OPINION }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || secrets.MAX_OUTPUT_TOKENS }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || vars.LOOKBACK_DAYS || secrets.LOOKBACK_DAYS }}
          SUMMARY_REFUSAL_FALLBACK: ${{ vars.SUMMARY_REFUSAL_FALLBACK || secrets.SUMMARY_REFUSAL_FALLBACK }}
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL || secrets.CONTACT_EMAIL }}
          BUTTONDOWN_TEST_RECIPIENTS: ${{ vars.BUTTONDOWN_TEST_RECIPIENTS || secrets.BUTTONDOWN_TEST_RECIPIENTS }}
          # Manual runs default to a dry run; scheduled runs are real runs.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          PYTHONUTF8: "1"
        run: python -m src.main

      - name: Save summary cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .cache/summaries
          key: summaries-${{ github.run_id }}-${{ github.run_attempt }}
        continue-on-error: true

      - name: Copy the state file into the artifact
        # So the record of this run can be restored by hand if the commit step below fails.
        if: always()
        run: |
          if [ -f data/processed.json ]; then
            mkdir -p output
            cp data/processed.json output/processed.json
          fi

      - name: Upload the digest as an artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-run-${{ github.run_number }}
          path: output/
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit data/processed.json
        # Runs whenever the run changed data/processed.json: an email was created (even if a later
        # step such as sending failed), or a run in which every summary failed recorded the attempts.
        # The next run then never summarizes or emails the same opinions again.
        if: always() && steps.digest.outputs.state_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # This run's record: it names emails that were just created, so it must never be lost.
          cp data/processed.json "${RUNNER_TEMP}/processed.run.json"
          git add data/processed.json
          if git diff --cached --quiet; then
            echo "data/processed.json is unchanged."
            exit 0
          fi
          git commit -m "Record processed opinions [skip ci]"
          for attempt in 1 2 3; do
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              conflicts="$(git diff --name-only --diff-filter=U)"
              if [ "${conflicts}" = "data/processed.json" ]; then
                # Someone changed data/processed.json while this run was going (a hand edit, say).
                # Keep this run's file: dropping it would email these opinions again.
                echo "::warning::data/processed.json was changed on ${GITHUB_REF_NAME} during this run; this run's version was kept. Re-apply any hand edit made in the meantime."
                cp "${RUNNER_TEMP}/processed.run.json" data/processed.json
                git add data/processed.json
                if ! GIT_EDITOR=true git rebase --continue; then
                  git rebase --abort || true
                fi
              else
                git rebase --abort || true
              fi
            fi
            if [ ! -d .git/rebase-merge ] && [ ! -d .git/rebase-apply ] && git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying in 10 seconds..."
            sleep 10
          done
          echo "::error::Could not push data/processed.json. Restore it from this run's artifact (processed.json) before the next run, or that run may email these opinions again."
          exit 1
